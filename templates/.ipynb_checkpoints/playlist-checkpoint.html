<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #C8FBCC;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 900px;
        }
        .table-container {
	    max-height: 400px; /* Set the max height of the scrollable area */
            overflow-y: scroll; /* Enable vertical scrolling */
            margin-bottom: 30px;
        }
        .btn-one {
	    background-color: #89E88F;
            border: none;
            font-size: 18px;
            padding: 12px;
            width: 30%;
        }
	.btn-two {
	    background-color: #1DB954;
            border: none;
            font-size: 18px;
            padding: 12px;
            width: 30%;
	    height: 50%
        }
	.btn-three {
	    background-color: #7DCEA0;
            border: none;
            font-size: 18px;
            padding: 12px;
            width: 30%;
	    height: 50%
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">Songs in Both User Playlists and Kaggle Dataset</h2>
        
        <div class="table-container">
            <!-- Pandas DataFrame as HTML -->
            {{ table|safe }}
        </div>

        <div class="text-center">
            <a href="/login" class="btn btn-one">Login Another User with Spotify</a>
		<br> <br>
        	<p>OR</p>
            <a href="/display-recommended" class="btn btn-two">See Combined Recommendations Playlist</a>
		<br> <br>
        	<p>OR</p>
            <a href="/display-data" class="btn btn-three">See Combined Data</a>
        </div>
    </div>

</body>
</html>
