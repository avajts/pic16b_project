<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Plot Type and Features</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #89E88F;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 500px;
        }
        .scatter-btn {
            background-color: #52BE80;  
            color: white;               
            padding: 10px 20px;         
            border: none;              
            border-radius: 5px;              
            font-size: 16px;     
	    width: 70%      
        }
        .hist-btn {
            background-color: #45b39d;  
            color: white;               
            padding: 10px 20px;         
            border: none;              
            border-radius: 5px;              
            font-size: 16px;     
	    width: 70%      
        }    
        .back-btn {
            background-color: #73c6b6;
            border: none;
            font-size: 18px;
            padding: 12px;
            width: 30%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">Select Plot Type</h2>
        <div class="text-center">
            <a href="/display-data/two-var-plot" class="btn scatter-btn">Two-Variable Scatterplot</a>
		<br> <br>
        	<p>OR</p>
            <a href="/display-data/genre-hist" class="btn hist-btn">Genre Histogram</a>
		<br> <br>
        	<p>OR</p>
            <a href="/playlists" class="btn back-btn">Go back</a>
        </div>
    </div>

</body>
</html>
