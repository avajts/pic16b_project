<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #C8FBCC;
        }
        .btn-one {
            background-color: #89E88F;
            border: none;
            font-size: 18px;
            padding: 12px;
            width: 30%;
        }
        </style>    
        <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    </head>
    
<body>

    <div class="container">
        <h2 class="text-center">Genre Histogram</h2>
        <form action="/display-data/genre-hist" method="POST">
            
            <div class="mb-3">
                <label for="genre" class="form-label">Genre</label>
                <input type="text" class="form-control" id="genre" name="genre" required>
            </div>
            <button type="submit" class="btn submit-btn w-100">Submit</button>
        </form>
        <div id="genre-hist"></div>
        <script>
            var graph_data = {{ graph_json | safe }};
            Plotly.plot('genre-hist', graph_data, {});
        </script>
        
        <div class="text-center">
            <a href="/display-data" class="btn btn-one">Back</a>
        </div>
        
    </div>
</body>
</html>
