<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Playlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #89E88F;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 900px;
        }
        .table-container {
            max-height: 400px;
            overflow-y: scroll;
            margin-bottom: 20px;
        }
	.back-btn {
            background-color: #1DB954;  
            color: white;               
            padding: 10px 20px;         
            border: none;              
            border-radius: 5px;                
            font-size: 16px;           
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">Recommended Playlist</h2>
        
        <div class="table-container">
            {{ table|safe }}
        </div>

        <div class="text-center">
            <a href="/display-recommended" class="btn back-btn">Go Back</a>
        </div>
    </div>

</body>
</html>
